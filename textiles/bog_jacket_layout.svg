<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-labelledby="t d">
  <title id="t">Bog Jacket layout</title>
  <desc id="d">Flat layout of a Bog Jacket: a rectangle A wide and B tall. The top band, 2C deep, is the shoulders and sleeves in a light color. Below it the center block is the back and the outer quarter-width blocks are the fronts, in a dark color. Solid lines are cuts or openings, dashed lines are folds, and the dotted line is the center back.</desc>

  <!-- Color zones: shoulders and sleeves (light), body (dark) -->
  <rect x="40" y="60" width="400" height="100" fill="#e4dccb"/>
  <rect x="40" y="160" width="400" height="180" fill="#3d4f63"/>

  <!-- Outline -->
  <rect x="40" y="60" width="400" height="280" fill="none" stroke="#1f2a36" stroke-width="2.5"/>

  <g fill="none" stroke-linecap="round">
    <!-- Cuts / openings (solid) -->
    <line x1="240" y1="60" x2="240" y2="98" stroke="#1f2a36" stroke-width="2.5"/>
    <path d="M222 110 Q222 92 240 92 Q258 92 258 110 Z" fill="#eef2f6" stroke="#1f2a36" stroke-width="2.5"/>
    <line x1="40" y1="160" x2="140" y2="160" stroke="#1f2a36" stroke-width="3"/>
    <line x1="340" y1="160" x2="440" y2="160" stroke="#1f2a36" stroke-width="3"/>

    <!-- Folds (dashed) -->
    <line x1="40" y1="110" x2="222" y2="110" stroke="#1f2a36" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="258" y1="110" x2="440" y2="110" stroke="#1f2a36" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="140" y1="160" x2="140" y2="340" stroke="#e4dccb" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="340" y1="160" x2="340" y2="340" stroke="#e4dccb" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="40" y1="328" x2="440" y2="328" stroke="#e4dccb" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Center back (dotted) -->
    <line x1="240" y1="110" x2="240" y2="160" stroke="#1f2a36" stroke-width="2" stroke-dasharray="2 5"/>
    <line x1="240" y1="160" x2="240" y2="340" stroke="#e4dccb" stroke-width="2" stroke-dasharray="2 5"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- Zone labels -->
    <text x="90" y="140" font-size="15" fill="#1f2a36">sleeve</text>
    <text x="390" y="140" font-size="15" fill="#1f2a36">sleeve</text>
    <text x="175" y="140" font-size="15" fill="#1f2a36">shoulders</text>
    <text x="305" y="140" font-size="15" fill="#1f2a36">shoulders</text>
    <text x="90" y="255" font-size="15" fill="#ffffff">front</text>
    <text x="390" y="255" font-size="15" fill="#ffffff">front</text>
    <text x="190" y="255" font-size="15" fill="#ffffff">back</text>
    <text x="290" y="255" font-size="15" fill="#ffffff">back</text>

    <!-- Dimensions -->
    <g stroke="#1f2a36" stroke-width="1.2">
      <line x1="40" y1="40" x2="440" y2="40"/>
      <line x1="40" y1="34" x2="40" y2="46"/><line x1="440" y1="34" x2="440" y2="46"/>
      <line x1="458" y1="60" x2="458" y2="340"/>
      <line x1="452" y1="60" x2="464" y2="60"/><line x1="452" y1="340" x2="464" y2="340"/>
      <line x1="22" y1="60" x2="22" y2="160"/>
      <line x1="16" y1="60" x2="28" y2="60"/><line x1="16" y1="110" x2="28" y2="110"/><line x1="16" y1="160" x2="28" y2="160"/>
      <line x1="40" y1="172" x2="140" y2="172" stroke="#e4dccb"/>
    </g>
    <text x="240" y="33" font-size="16" fill="#1f2a36" font-style="italic">A</text>
    <rect x="451" y="190" width="14" height="20" fill="#eef2f6"/>
    <text x="458" y="206" font-size="16" fill="#1f2a36" font-style="italic">B</text>
    <rect x="15" y="76" width="14" height="18" fill="#eef2f6"/>
    <text x="22" y="90" font-size="15" fill="#1f2a36" font-style="italic">C</text>
    <rect x="15" y="126" width="14" height="18" fill="#eef2f6"/>
    <text x="22" y="140" font-size="15" fill="#1f2a36" font-style="italic">C</text>
    <text x="90" y="190" font-size="13" fill="#e4dccb" font-style="italic">¼ A</text>
  </g>

  <!-- Legend -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2a36">
    <line x1="40" y1="372" x2="80" y2="372" stroke="#1f2a36" stroke-width="2.5"/>
    <text x="88" y="376">cut or opening</text>
    <line x1="200" y1="372" x2="240" y2="372" stroke="#1f2a36" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="248" y="376">fold</text>
    <line x1="310" y1="372" x2="350" y2="372" stroke="#1f2a36" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="358" y="376">center back</text>
    <rect x="40" y="396" width="18" height="14" fill="#e4dccb" stroke="#1f2a36"/>
    <text x="66" y="408">shoulders and sleeves</text>
    <rect x="240" y="396" width="18" height="14" fill="#3d4f63" stroke="#1f2a36"/>
    <text x="266" y="408">body</text>
  </g>
</svg>
